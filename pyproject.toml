[project]
name = "fusion-agent"
version = "0.1.0"
description = "An offline agent that answers questions across text reports, imagery and telemetry, with citations, guardrails and evaluation."
readme = "README.md"
authors = [
    { name = "Daniel Ball", email = "6998018+dgnball@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "mcp>=1.2",
    "numpy>=1.26",
    "pillow>=10.4",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real embedding models. Tests and CI use a deterministic hashing embedder instead.
models = ["sentence-transformers>=3.0"]

[project.scripts]
fusion-agent = "fusion_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
